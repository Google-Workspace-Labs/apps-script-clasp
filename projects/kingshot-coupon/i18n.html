              d.nc === 'ok' ? 'verified' : d.nc === 'no_user' ? 'no user to verify' : `pending(${d.nr})`;
            return `✅ Coupon registered: ${d.code} [${d.status}, ${note}]\nBatch runs in background; results via Slack.`;
          },
          srv_batch_scheduled: '⚡ Batch scheduled — runs in ~30s; results via Slack.',
          srv_clean_none: 'ℹ️ No typo codes to clean.',
          srv_clean_done: (d) => `✅ Removed ${d.coupons} typo code(s) · ${d.logs} logs cleaned`,
          srv_sync_fail: (d) => `❌ Sync failed: ${d.reason}`,
          srv_autosync_set: (d) => `✅ Auto-sync: ${d.prev ? 'ON' : 'OFF'} → ${d.on ? 'ON' : 'OFF'}`,
          srv_slack_lang_set: (d) => `✅ Slack alert language: ${d.lang === 'en' ? 'English' : 'Korean'}`,
        },
      };
</script>
