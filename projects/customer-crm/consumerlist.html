<script>
let cropper;

$(document).ready(function() {
	dataTable = $('#consumerTable').DataTable({
		responsive: true,
		order: []
	});
	// Load initial data
	loadConsumerData();
});

function loadConsumerData() {
	google.script.run.withSuccessHandler(function(data) {
		dataTable.clear();
		data.forEach(function(row, index) {
			const imageSlideshow = row.imageUrls.map(
				(url, i) => `<img src="${url}" onclick="CallZoomImage('${url}')" class="consumer-image slide-${index}" alt="Image ${i + 1}" 
                style="width: 100px; height: 100px; object-fit: cover; display: ${i === 0 ? 'block' : 'none'};">`).join('');
			const slideshowHtml = `
          <div class="slideshow-container" style="position: relative; width: 100px; height: 100px;">
            ${imageSlideshow}
            <button class="prev-slide" style="position: absolute; top: 50%; left: 0; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 5px; cursor: pointer;" 
                    onclick="changeSlide(${index}, -1)">❮</button>
            <button class="next-slide" style="position: absolute; top: 50%; right: 0; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 5px; cursor: pointer;" 
                    onclick="changeSlide(${index}, 1)">❯</button>
          </div>
        `;
			dataTable.row.add([
				row.name,
				row.address,
				row.mobileno,
				row.email,
				row.age,
				row.gender,
				slideshowHtml, `<div style="display: flex; gap: 10px;">
                <button class="btn btn-primary btn-sm edit-btn" onclick="editRecord(${index + 1})">Edit</button>
                <button class="btn btn-danger btn-sm edit-btn" onclick="DelRecord(${index + 1})">Delete</button>
              </div>`
			]).draw(false);
			// Automatically start the slideshow for each row
			startSlideshow(index, row.imageUrls.length);
		});
	}).getConsumerData();
}
// Function to handle slide changes
function changeSlide(slideshowIndex, direction) {
	const slides = document.querySelectorAll(`.slide-${slideshowIndex}`);
	let currentIndex = Array.from(slides).findIndex((slide) => slide.style.display === 'block');
	slides[currentIndex].style.display = 'none';
	currentIndex = (currentIndex + direction + slides.length) % slides.length; // Wrap around
	slides[currentIndex].style.display = 'block';
}

const slideshowIntervals = {}; // Store intervals for each slideshow

function startSlideshow(slideshowIndex, totalSlides) {
    let currentIndex = 0;
    const slides = document.querySelectorAll(`.slide-${slideshowIndex}`);

    if (slides.length === 0) return; // Prevent errors if no slides exist

    // Clear any existing interval for this slideshow
    if (slideshowIntervals[slideshowIndex]) {
        clearInterval(slideshowIntervals[slideshowIndex]);
    }

    slideshowIntervals[slideshowIndex] = setInterval(() => {
        slides[currentIndex].style.display = 'none'; // Hide current slide
        currentIndex = (currentIndex + 1) % totalSlides; // Move to next slide
        slides[currentIndex].style.display = 'block'; // Show new slide
    }, 3000);
}

// Call slideshow for slide-0
startSlideshow(0, 2); // Update totalSlides dynamically if needed

	zoomedImage.src = imageUrl; // Set the source of the zoomed image

function editRecord(rowIndex) {

	$('#name').val(rowData[0]);
	$('#address').val(rowData[1]);
	$('#mobileno').val(rowData[2]);
	$('#email').val(rowData[3]);
	$('#age').val(rowData[4]);
	$('#gender').val(rowData[5]);
	// Extract image URLs from the slideshow HTML
	const imageUrls = [];
	const tempDiv = document.createElement('div');
	tempDiv.innerHTML = rowData[6]; // Parse the slideshow HTML
	const imgElements = tempDiv.querySelectorAll('img');
	imgElements.forEach((img) => {
		imageUrls.push(img.src); // Add image URL to array
	});
	// Display images as Base64 with delete buttons
	addImageButton.disabled = false;
	populateImages(imageUrls);
	const customerupdateLabel = document.getElementById("customerupdateLabel");
	customerupdateLabel.innerHTML = "Update Consumer Data";
	customerupdateLabel.style.color = "yellow"; // Set text color to yellow
	customerupdateLabel.style.fontWeight = "bold"; // Make text bold
	customerupdateLabel.style.fontSize = "18px"; // Set font size
	customerupdateLabel.style.backgroundColor = "green"; // Optional: set background color for emphasis
	customerupdateLabel.style.padding = "5px"; // Optional: add padding for better visual appeal
	// Apply the blinking effect using CSS animation
	customerupdateLabel.style.animation = "blink 5s infinite"; // 1s duration, infinite repeat
	const submitButton = document.getElementById("submitbutton");
	// Remove the 'btn-success' class and add the 'btn-danger' class
	submitButton.classList.remove("btn-success", "btn-danger");
	submitButton.classList.add("btn-warning");
	// Update the form buttons
	$('#submitbutton').text('Update');
	$('#cancelEdit').show();
	// Scroll to the form
	$('html, body').animate({
		scrollTop: $('#consumerForm').offset().top
	}, 500);
}

function populateImages(images) {
	imageContainer.innerHTML = ""; // Clear existing images
	// Fetch Base64 images via Apps Script
	google.script.run.withSuccessHandler((base64Images) => {
		base64Images.forEach((base64Image) => {
			// Create the image wrapper
			const imageWrapper = document.createElement("div");
			imageWrapper.className = "image-wrapper";
			imageWrapper.style.position = "relative";
			imageWrapper.style.display = "inline-block";
			imageWrapper.style.margin = "10px";
			// Add the Base64 image
			const imgElement = document.createElement("img");
			imgElement.src = base64Image; // Use Base64 string as src
			imgElement.style.width = "100px";
			imgElement.style.height = "100px";
			imgElement.style.objectFit = "cover";
			imgElement.style.cursor = "pointer";
			// Add a delete button
			const deleteButton = document.createElement("button");
			deleteButton.textContent = "X";
			deleteButton.className = "btn btn-danger btn-sm";
			deleteButton.style.position = "absolute";
			deleteButton.style.top = "5px";
			deleteButton.style.right = "5px";
			deleteButton.style.borderRadius = "50%";
			// Add click event to open zoom modal
			imgElement.addEventListener("click", function() {
				zoomedImage.src = base64Image; // Set the source of the zoomed image
				$("#zoomModal").modal("show"); // Open the zoom modal
			});
			// Delete image on button click
			deleteButton.addEventListener("click", () => {
				imageContainer.removeChild(imageWrapper);
			});
			// Append elements to the wrapper
			imageWrapper.appendChild(imgElement);
			imageWrapper.appendChild(deleteButton);
			imageContainer.appendChild(imageWrapper);
		});
	}).imageBase64Urls(images);
}
// Handle "Add Image" button
addImageButton.addEventListener("click", function() {
	const imageInput = document.createElement("input");
	imageInput.type = "file";
	imageInput.accept = "image/*";
	imageInput.style.display = "none";
	// Append input to body and trigger click
	document.body.appendChild(imageInput);
	imageInput.click();
	// Remove input after use
	imageInput.addEventListener("change", function(event) {
		const files = event.target.files;
		if(files && files.length > 0) {
			selectedFile = files[0];
			const reader = new FileReader();
			reader.onload = function(e) {
				imageToCrop.src = e.target.result;
				// Fetch dynamic settings and open the cropper modal
				$("#cropperModal").modal("show");
			};
			reader.readAsDataURL(files[0]);
		}
		document.body.removeChild(imageInput); // Cleanup
	});
});
// Initialize cropper when the modal is shown
$("#cropperModal").on("shown.bs.modal", function() {
	cropper = new Cropper(imageToCrop, {
		aspectRatio: cropWidth / cropHeight, // Use dynamic aspect ratio
		viewMode: 1,
	});
});
// Destroy cropper when the modal is hidden
$("#cropperModal").on("hidden.bs.modal", function() {
	if(cropper) {
		cropper.destroy();
		cropper = null;
	}
});
// Handle cropping and add cropped image to container
cropAndSaveButton.addEventListener("click", function() {
	if(cropper) {
		const croppedCanvas = cropper.getCroppedCanvas({
			width: cropWidth, // Use dynamic width
			height: cropHeight, // Use dynamic height
		});
		const croppedImage = croppedCanvas.toDataURL("image/png");
		// Create a container for the cropped image
		const imageWrapper = document.createElement("div");
		imageWrapper.className = "image-wrapper";
		imageWrapper.style.position = "relative";
		imageWrapper.style.display = "inline-block";
		imageWrapper.style.margin = "10px";
		// Add the cropped image
		const imgElement = document.createElement("img");
		imgElement.src = croppedImage;
		imgElement.style.width = "100px";
		imgElement.style.height = "100px";
		imgElement.style.objectFit = "cover";
		imgElement.style.cursor = "pointer"; // Add pointer cursor
		// Add a delete button
		const deleteButton = document.createElement("button");
		deleteButton.textContent = "X";
		deleteButton.className = "btn btn-danger btn-sm";
		deleteButton.style.position = "absolute";
		deleteButton.style.top = "5px";
		deleteButton.style.right = "5px";
		deleteButton.style.borderRadius = "50%";
		// Delete image on button click
		deleteButton.addEventListener("click", function() {
			imageContainer.removeChild(imageWrapper);
		});
		// Add click event to open zoom modal
		imgElement.addEventListener("click", function() {
			zoomedImage.src = croppedImage; // Set the source of the zoomed image
			$("#zoomModal").modal("show"); // Open the zoom modal
		});
		// Append elements to the wrapper
		imageWrapper.appendChild(imgElement);
		imageWrapper.appendChild(deleteButton);
		imageContainer.appendChild(imageWrapper);
		// Close the cropper modal
		$("#cropperModal").modal("hide");
	}
});

    addImageButton.disabled = true;

    const name = $('#name').val();
    const mobileno = $('#mobileno').val();
    const rowIndex = $('#rowIndex').val();
    const currentDate = new Date().toISOString().split('T')[0];

    
    const base64DataArray = [];
    $('#imageContainer img').each(function(index, img) {
        const base64Data = img.src.split(',')[1]; // Extract Base64 data
        const fileName = `${name}_${mobileno}_${currentDate}_image${index + 1}.jpg`;
        base64DataArray.push({ base64Data, fileName });
    });

    // If no images are selected, submit the form immediately
    if (base64DataArray.length === 0) {
        submitFormWithoutImages(rowIndex);
        return;
    }

    // Otherwise, upload images first
    const images = [];
    let uploadCount = 0;
    
    base64DataArray.forEach(({ base64Data, fileName }) => {
        google.script.run
            .withSuccessHandler(function(imageUrl) {
                images.push(imageUrl);
                uploadCount++;

                if (uploadCount === base64DataArray.length) {
                    submitFormWithImages(rowIndex, images);
                }
            })
            .uploadFile(base64Data, fileName);
    });
});

function submitFormWithImages(rowIndex, images) {

// Function to fetch old image URLs from the form (Modify as needed)
function getOldImages(rowIndex) {
    let rowIndexnum = rowIndex.toString().replace(/\D/g, '');
    const rowData = dataTable.row(rowIndexnum - 1).data(); // Get row data
    const oldImages = [];
    // Convert rowData (HTML content) into a temporary DOM element
    const tempDiv = document.createElement("div");

    tempDiv.innerHTML = rowData[6]; 
    
    // Find all images inside the div and extract their src attributes
    $(tempDiv).find("img").each(function() {
        oldImages.push($(this).attr("src"));
    });
    
    return oldImages;
}




function submitsuccess(result) {
	refreshButton.innerHTML = 'Submit';
	refreshButton.disabled = false;
	addImageButton.disabled = false;
	if (result === 'inserted') {
		toastr.success('Inserted Successfully.');
		resetForm();
		loadConsumerData();
	} else if (result === 'deleted') {
		toastr.error('Deleted Successfully. dd');
		resetForm();
		loadConsumerData();
	} else if (result === 'updated') {
		toastr.warning('Updated Successfully.up');
		resetForm();
		loadConsumerData();
	} else {
		toastr.error('An error occurred. Please try again.');
	}
	$("#customerupdate").modal("hide");
}

function resetForm() {
	isEditing = false;
	$('#consumerForm')[0].reset();
	$('#rowIndex').val('');
	$('#imagePreview').empty();
	croppedImageDataURL = null;
	imageContainer.innerHTML = "";
	$('#submitbutton').text('Submit');
	$('#cancelEdit').hide();
	$('#image').prop('required', true);
}
$('#cancelEdit').click(function() {
	resetForm();
});
