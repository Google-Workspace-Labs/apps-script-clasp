function loadConsumerData() {
	google.script.run.withSuccessHandler(function(data) {
		dataTable.clear();
		data.forEach(function(row, index) {
			const imageSlideshow = row.imageUrls.map(
				(url, i) => `<img src="${url}" onclick="CallZoomImage('${url}')" class="consumer-image slide-${index}" alt="Image ${i + 1}" 
                style="width: 100px; height: 100px; object-fit: cover; display: ${i === 0 ? 'block' : 'none'};">`).join('');
			const slideshowHtml = `
          <div class="slideshow-container" style="position: relative; width: 100px; height: 100px;">
            ${imageSlideshow}
            <button class="prev-slide" style="position: absolute; top: 50%; left: 0; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 5px; cursor: pointer;" 
                    onclick="changeSlide(${index}, -1)">❮</button>
            <button class="next-slide" style="position: absolute; top: 50%; right: 0; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 5px; cursor: pointer;" 
                    onclick="changeSlide(${index}, 1)">❯</button>
          </div>
        `;
			dataTable.row.add([
				row.name,
				row.address,
				row.mobileno,
				row.email,
				row.age,
				row.gender,
				slideshowHtml, `<div style="display: flex; gap: 10px;">
                <button class="btn btn-info btn-sm" onclick="showFollowUps('${row.mobileno}', '${row.email}')">Follow-ups</button>
              </div>`
			]).draw(false);
			// Automatically start the slideshow for each row
			startSlideshow(index, row.imageUrls.length);
		});
	}).getConsumerData();
}
// Function to handle slide changes
function changeSlide(slideshowIndex, direction) {
	const slides = document.querySelectorAll(`.slide-${slideshowIndex}`);
	let currentIndex = Array.from(slides).findIndex((slide) => slide.style.display === 'block');
	slides[currentIndex].style.display = 'none';
	currentIndex = (currentIndex + direction + slides.length) % slides.length; // Wrap around
	slides[currentIndex].style.display = 'block';
}
// Function to start automatic slideshow
function startSlideshow(slideshowIndex, totalSlides) {
	let currentIndex = 0;
	setInterval(() => {
		const slides = document.querySelectorAll(`.slide-${slideshowIndex}`);
		slides[currentIndex].style.display = 'none';
		currentIndex = (currentIndex + 1) % totalSlides; // Move to the next slide
		slides[currentIndex].style.display = 'block';
	}, 3000); // Change image every 3 seconds (adjust as needed)
}

function CallZoomImage(imageUrl) {
	zoomedImage.src = imageUrl; // Set the source of the zoomed image
	$("#zoomModal").modal("show"); // Open the zoom modal
}

function showFollowUps(mobileno, email) {
	const modal = document.getElementById('followUpsModal');
	modal.setAttribute('data-mobileno', mobileno);
	modal.setAttribute('data-email', email);
  emailEditor.root.innerHTML = "";
  phoneCallEditor.root.innerHTML = "";
  document.getElementById('phoneCallResponse').value = "";
	// Show modal
	const followUpsModal = new bootstrap.Modal(modal);
	followUpsModal.show();
	// Clear follow-ups list initially
	const followUpsList = document.getElementById('followUpsList');
	followUpsList.innerHTML = '<p class="text-muted">Loading follow-ups...</p>';
	// Fetch follow-ups data
	google.script.run.withSuccessHandler(function(followUps) {
		followUpsList.innerHTML = ''; // Clear placeholder
		// Sort follow-ups by date and time in descending order
		followUps.sort((a, b) => {
			const dateA = new Date(`${a.date}`);
			const dateB = new Date(`${b.date}`);
			return dateB - dateA; // Most recent first
		});
		if(followUps.length > 0) {
			followUps.forEach((followUp) => {
				followUpsList.innerHTML += `
                <div class="mb-3 p-3 border rounded bg-light">
                  <p><strong>Date:</strong> ${followUp.date || 'N/A'} <strong>User:</strong> ${followUp.user || 'N/A'}, Mode: ${followUp.messagemode || 'N/A'}</p>
                  <p><strong>Message:</strong> ${followUp.message}</p>
                  <p><strong>Response:</strong> ${followUp.response}</p>
                </div>
              `;
			});
		} else {
			followUpsList.innerHTML = '<p class="text-muted">No follow-ups found for this consumer.</p>';
		}
	}).getFollowUps(mobileno, email);
}
