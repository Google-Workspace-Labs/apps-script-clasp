  <style>
    /* CSS for styling  */
    body {
      font-family: Arial, sans-serif;

    }

    .login-container {
      max-width: 400px;

<body>

<section class="vh-100">
  <div class="container py-5 h-100" id="logindiv" style="display:none">
    <div class="row d-flex align-items-center justify-content-center h-100">
      <div class="col-md-8 col-lg-7 col-xl-6">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
          class="img-fluid" alt="Phone image">
      </div>
      <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1" >
           <a style="display:none" id="pageURL" href="" target="_top">Link</a>
          <input type="text" class="form-control" id="urllink" name="urllink" value="<?= urllink; ?>" style="display:none;">
        <form>
          <!-- Email input -->
          <div data-mdb-input-init class="form-outline mb-4">
          <label for="userid" class="form-label">EMail:</label>
          <input type="text" class="form-control" id="userid" name="userid" placeholder="xxxx@gmail.com" required>
          </div>

          <!-- Password input -->
          <div data-mdb-input-init class="form-outline mb-4">
          <label for="password" class="form-label">Password:</label>
          <input type="password" class="form-control" id="password" name="password" required>
          </div>


          <!-- Submit button -->
          <button type="button" id="loginButton" class="btn btn-success" onclick="submitLoginForm()">Login</button>

          <p id="loginResult" class="mt-3"></p>
        </form>
      </div>
    </div>
  </div>
</section>

<script type="text/javascript">

    document.addEventListener("DOMContentLoaded", function () {
      var deployLink = "<?= urllink; ?>";
      console.log(localStorage.getItem("userRole"));
      // If user is already logged in, redirect to dashboard
      if (localStorage.getItem("userRole")) {
        if(localStorage.getItem("userRole")=="admin"){
          window.location.replace(deployLink + "?page=dashboard");
        }else{
          window.location.replace(deployLink + "?page=userdashboard");
        }
      }else{
        document.getElementById("logindiv").style.display = "block";
      }
    });

    function submitLoginForm() {
      var email = document.getElementById("userid").value;
      var password = document.getElementById("password").value;

    if (!email || !password) {
      document.getElementById("loginResult").innerText ='Please fill all the fields.';
      return;
    }

    var button1 = document.getElementById('loginButton');
    button1.innerHTML = 'Please Wait..';
    button1.disabled = true;

      google.script.run.withSuccessHandler(function(response) {
        
        if (response.success && response.status=="active") {
          localStorage.setItem("userRole", response.role);
          localStorage.setItem("username", response.username);
          localStorage.setItem("userid", response.emailid);
          localStorage.setItem("userPages", JSON.stringify(response.pages));
          sessionStorage.setItem('menuheader', "Dashboard Page.");
          if (response.role=="admin"){
            redirectpage('dashboard');
          }else{
            redirectpage('userdashboard');
          }
          
        } else if(response.success && response.status=="inactive"){
          button1.innerHTML = 'Login';
          button1.disabled = false;
          toastr.error("User verified but User is Inactive. Please contact Admin.");
          return false;
        } else {
          button1.innerHTML = 'Login';
          button1.disabled = false;
          toastr.error(response.message);
          return false;
        }
      }).checkLogin(email, password);
    }

    function redirectpage(page){
      var googleappscript = document.getElementById("urllink").value;
      var myAnchor = document.getElementById('pageURL');
      myAnchor.href = googleappscript + '?page='+page; // Assigning the URL to the href attribute
      myAnchor.click();
      document.getElementById("pageURL").click();
    }

  </script>   
      <script src="https://code.jquery.com/jquery-3.7.0.min.js" crossorigin="anonymous"></script>

    <!-- Bootstrap JS - Include from CDN or download locally -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> 
  </body> 
</html>
