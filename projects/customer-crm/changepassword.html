<?!= include('header'); ?>
  <a style="display:none" id="pageURL" href="" target="_top">Link</a>
  <input type="text" class="form-control" id="urllink" name="urllink" value="<?= urllink; ?>" style="display:none;">
  <input type="text" class="form-control" id="currentpage" name="currentpage" value="<?= currentpage; ?>" style="display:none;">

    <div class="container">

        <div class="mb-3" style="padding-top:20px;">
            <label class="form-label">Name:</label>
            <input type="text" id="userName" class="form-control" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Email ID:</label>
            <input type="text" id="userEmail" class="form-control" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Current Password:</label>
            <input type="password" id="currentPassword" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">New Password:</label>
            <input type="password" id="newPassword" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Re-enter New Password:</label>
            <input type="password" id="confirmPassword" class="form-control">
        </div>

        <button id="changePasswordBtn" class="btn btn-primary">Change Password</button>
    </div>


   <script>
        document.addEventListener("DOMContentLoaded", function () {
            const userEmail = localStorage.getItem("userid");
            const userNameField = document.getElementById("userName");
            const userEmailField = document.getElementById("userEmail");
            const currentPasswordField = document.getElementById("currentPassword");
            const newPasswordField = document.getElementById("newPassword");
            const confirmPasswordField = document.getElementById("confirmPassword");
            const changePasswordBtn = document.getElementById("changePasswordBtn");

            // Fetch user details
            function fetchUserDetails() {
                google.script.run.withSuccessHandler((user) => {
                    if (user) {
                        userNameField.value = user.name;
                        userEmailField.value = user.email;
                    } else {
                        alert("User not found!");
                    }
                }).getUserByEmail(userEmail);
            }

            fetchUserDetails();

            // Change Password Event
            changePasswordBtn.addEventListener("click", function () {
                const currentPassword = currentPasswordField.value.trim();
                const newPassword = newPasswordField.value.trim();
                const confirmPassword = confirmPasswordField.value.trim();
                changePasswordBtn.innerHTML = 'Please Wait..';
                changePasswordBtn.disabled = true;

                if (!currentPassword || !newPassword || !confirmPassword) {
                    changePasswordBtn.innerHTML = 'Change Password';
                    changePasswordBtn.disabled = false;
                    toastr.error("All fields are required!");
                    return;
                }

                if (newPassword !== confirmPassword) {
                    changePasswordBtn.innerHTML = 'Change Password';
                    changePasswordBtn.disabled = false;
                    toastr.error("New passwords do not match!");
                    return;
                }

                google.script.run.withSuccessHandler((response) => {
                    changePasswordBtn.innerHTML = 'Change Password';
                    changePasswordBtn.disabled = false;                    
                    if (response.success) {
                        currentPasswordField.value = "";
                        newPasswordField.value = "";
                        confirmPasswordField.value = "";
                        toastr.success(response.message);
                    }else{
                        toastr.error(response.message);
                    }
                }).changeUserPassword(userEmail, currentPassword, newPassword);
            });
        });
    </script>
