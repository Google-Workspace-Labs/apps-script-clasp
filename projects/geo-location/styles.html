<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f4f7f6;
    color: #333;
  }
  .container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-sizing: border-box;
  }
  h1 {
    color: #2c3e50;
    margin-bottom: 25px;
  }
  button {
    background-color: #4caf50; /* Green */
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
    margin-bottom: 20px;
  }
  button:hover {
    background-color: #45a049;
  }
  #result {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #f9f9f9;
    text-align: left;
    word-wrap: break-word; /* 긴 텍스트 줄바꿈 */
  }
  .loading {
    color: #555;
    font-style: italic;
  }
  .error {
    color: #d9534f;
    font-weight: bold;
  }
  .info-label {
    font-weight: bold;
    color: #555;
  }
  /* 로딩 스피너 */
  .loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-left: 10px;
    display: none; /* 초기에는 숨김 */
  }
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>
