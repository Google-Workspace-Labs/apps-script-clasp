name: Auto-Merge Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' &&
      (github.base_ref == 'main' || github.base_ref == 'develop')

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Wait for CI checks
        id: wait-for-ci
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'quality'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success
        continue-on-error: true

      - name: Enable auto-merge (all updates)
        if: steps.wait-for-ci.outcome == 'success'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR (success)
        if: steps.wait-for-ci.outcome == 'success'
        run: |
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            EMOJI="🚀"
            MESSAGE="Major update - CI passed, auto-merging"
          else
            EMOJI="✅"
            MESSAGE="Patch/minor update - Auto-merging"
          fi

          gh pr comment "$PR_URL" --body "$EMOJI **$MESSAGE**

          - Update type: \`$UPDATE_TYPE\`
          - Package: \`$DEPENDENCY_NAMES\`
          - Version: \`$PREV_VERSION\` → \`$NEW_VERSION\`
          - CI: ✅ Passed
          - Auto-merge: Enabled"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on CI failure
        if: steps.wait-for-ci.outcome != 'success'
        run: |
          gh pr comment "$PR_URL" --body "❌ **CI checks failed**

          This PR will not be auto-merged. Please:
          - Review CI logs in the 'Checks' tab
          - Fix any issues
          - Push updates to re-trigger checks

          Package: \`$DEPENDENCY_NAMES\`"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
